services:
  db:
    image: postgres:15
    ports:
      - "5434:5432"
    container_name: new_product_db
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - app_network
    environment:
      POSTGRES_PASSWORD: user_product@321
      POSTGRES_USER: user_product
      POSTGRES_DB: new_product_db
  app:
    build: .
    ports:
      - "8083:8080"
    container_name: new_product_app
    depends_on:
      - db
    networks:
      - app_network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/new_product_db
      SPRING_DATASOURCE_USERNAME: user_product
      SPRING_DATASOURCE_PASSWORD: user_product@321
networks:
  app_network:
volumes:
  data: